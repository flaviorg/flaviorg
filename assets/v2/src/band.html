<!doctype html>
<html><head><meta charset="utf-8"><title>flaviorg band</title>
<link rel="stylesheet" href="common.css"><script>/[?&]theme=light\b/.test(location.search)&&document.write('<link rel="stylesheet" href="common-light.css">')</script>
<style>
  body { width: 1600px; }
  #band { width: 1600px; height: 70px; padding: 0 30px; display: flex; align-items: center; font-size: 24px;
          background: var(--card); border: 1px solid var(--line); border-radius: 12px; white-space: nowrap; }
  .dia { color: var(--coral); margin-right: 12px; }
  .who { color: var(--coral); font-weight: 600; }
  .dots { display: inline-flex; margin: 0 18px 0 18px; }
  .dots span { width: 16px; height: 16px; border-radius: 50%; margin-left: -3px; box-shadow: 0 0 0 2px var(--card); }
  .dots span:first-child { margin-left: 0; }
  i { font-style: normal; color: var(--dimmer); margin: 0 12px; }
  .ok { color: var(--ok); }
  .key { margin-left: auto; color: var(--text); }
  .key b { color: var(--dimmer); font-weight: 500; margin-right: 8px; }
</style></head>
<body>
<div id="band">
  <span class="dia">◆</span><span class="who">flavio</span>
  <span class="dots"><span style="background:var(--coral)"></span><span style="background:var(--teal)"></span><span style="background:var(--violet)"></span><span style="background:var(--gold)"></span></span>
  <span>4 running</span><i>·</i><span>9+ yrs</span><i>·</i><span>Braga, PT</span><i>·</i><span class="ok">open to freelance</span>
  <span class="key"><b>o:</b>oflavio.dev</span>
</div>
</body></html>
