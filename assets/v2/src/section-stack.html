<!doctype html>
<html><head><meta charset="utf-8"><title>flaviorg stack</title>
<link rel="stylesheet" href="common.css"><script>/[?&]theme=light\b/.test(location.search)&&document.write('<link rel="stylesheet" href="common-light.css">')</script><link rel="stylesheet" href="sections.css">
<style>
  .box { padding: 14px 36px; display: grid; grid-template-columns: 1fr 1fr; column-gap: 48px; }
  .r { display: grid; grid-template-columns: 296px 1fr; align-items: center; height: 66px; border-bottom: 1px solid var(--line2); }
  .r:nth-last-child(-n+2) { border-bottom: 0; }
  .lbl { font-size: 18px; color: var(--dim); }
  .lbl::before { content: "◆"; color: var(--dimmer); margin-right: 12px; font-size: 14px; vertical-align: 2px; }
  .ic { display: flex; gap: 10px; align-items: center; }
  .ic img { height: 36px; display: block; }
</style></head>
<body>
<div id="sec" class="sec grid-bg">
  <div class="head"><b>$</b>cat stack</div>
  <div class="box">
    <div class="r"><span class="lbl">Frontend</span><span class="ic"><img src="stack/frontend-1.svg"><img src="stack/frontend-2.svg"></span></div>
    <div class="r"><span class="lbl">Mobile</span><span class="ic"><img src="stack/mobile.svg"></span></div>
    <div class="r"><span class="lbl">Backend, APIs &amp; CMS</span><span class="ic"><img src="stack/backend.svg"><img src="stack/apis-cms.svg"></span></div>
    <div class="r"><span class="lbl">Databases &amp; ORMs</span><span class="ic"><img src="stack/databases-sql.svg"><img src="stack/databases-nosql.svg"><img src="stack/orms.svg"></span></div>
    <div class="r"><span class="lbl">Quality &amp; observability</span><span class="ic"><img src="stack/testing.svg"><img src="stack/observability.svg"></span></div>
    <div class="r"><span class="lbl">Cloud &amp; DevOps</span><span class="ic"><img src="stack/devops.svg"></span></div>
    <div class="r"><span class="lbl">AI engineering</span><span class="ic"><img src="stack/ai-engineering.svg"></span></div>
    <div class="r"><span class="lbl">AI coding</span><span class="ic"><img src="stack/ai-coding.svg"></span></div>
  </div>
</div>
</body></html>
